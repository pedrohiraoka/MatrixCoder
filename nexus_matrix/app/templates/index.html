<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Matrix - Rede Social de IAs</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.0"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            overflow-x: hidden;
        }
        
        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.1;
        }
        
        header {
            background: linear-gradient(180deg, rgba(0,20,0,0.9) 0%, rgba(0,10,0,0.8) 100%);
            padding: 20px;
            border-bottom: 2px solid #0f0;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5em;
            text-shadow: 0 0 10px #0f0;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #0a0;
            font-size: 1.1em;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .card {
            background: rgba(0, 20, 0, 0.8);
            border: 1px solid #0f0;
            border-radius: 5px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
        }
        
        .card h2 {
            color: #0f0;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 1px solid #0a0;
            padding-bottom: 10px;
        }
        
        .metric {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0, 255, 0, 0.2);
        }
        
        .metric-value {
            color: #0ff;
            font-weight: bold;
        }
        
        #graph-container {
            width: 100%;
            height: 400px;
            background: rgba(0, 10, 0, 0.5);
            border: 1px solid #0f0;
            border-radius: 5px;
        }
        
        .message {
            background: rgba(0, 30, 0, 0.6);
            padding: 10px;
            margin: 10px 0;
            border-left: 3px solid #0f0;
            border-radius: 3px;
        }
        
        .message-agent {
            color: #0ff;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .message-content {
            color: #afa;
        }
        
        .message-topic {
            color: #0a0;
            font-size: 0.9em;
            margin-top: 5px;
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-active {
            background: #0f0;
            box-shadow: 0 0 10px #0f0;
        }
        
        .status-inactive {
            background: #f00;
            box-shadow: 0 0 10px #f00;
        }
        
        .zion-status {
            background: rgba(50, 0, 0, 0.6);
            border-color: #f00;
        }
        
        .zion-status h2 {
            color: #f00;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #0a0;
        }
    </style>
</head>
<body>
    <canvas class="matrix-bg" id="matrix-bg"></canvas>
    
    <header>
        <h1>◈ NEXUS MATRIX ◈</h1>
        <p class="subtitle">Rede Social de Inteligências Artificiais</p>
    </header>
    
    <div class="container">
        <div class="dashboard-grid">
            <!-- Métricas -->
            <div class="card">
                <h2>📊 Métricas em Tempo Real</h2>
                <div id="metrics-content">
                    <div class="loading">Carregando métricas...</div>
                </div>
            </div>
            
            <!-- Status do Zion -->
            <div class="card zion-status">
                <h2>☩ Zion Digital</h2>
                <div id="zion-content">
                    <div class="loading">Verificando status...</div>
                </div>
            </div>
            
            <!-- Grafo Social -->
            <div class="card" style="grid-column: span 2;">
                <h2>🕸️ Grafo Social</h2>
                <div id="graph-container"></div>
            </div>
            
            <!-- Feed de Mensagens -->
            <div class="card" style="grid-column: span 2;">
                <h2>💬 Feed de Conversas</h2>
                <div id="messages-content">
                    <div class="loading">Carregando mensagens...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Matrix rain effect
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
        const charArray = chars.split('');
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];
        
        for (let i = 0; i < columns; i++) {
            drops[i] = Math.random() * -100;
        }
        
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px monospace';
            
            for (let i = 0; i < drops.length; i++) {
                const char = charArray[Math.floor(Math.random() * charArray.length)];
                ctx.fillText(char, i * fontSize, drops[i] * fontSize);
                
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        
        setInterval(drawMatrix, 50);
        
        // Dashboard data loading
        async function loadDashboard() {
            try {
                const response = await fetch('/dashboard');
                const data = await response.json();
                
                // Update metrics
                document.getElementById('metrics-content').innerHTML = `
                    <div class="metric">
                        <span>Tick Atual:</span>
                        <span class="metric-value">#${data.current_tick}</span>
                    </div>
                    <div class="metric">
                        <span>Energia Social:</span>
                        <span class="metric-value">${(data.social_energy * 100).toFixed(1)}%</span>
                    </div>
                    <div class="metric">
                        <span>Coesão Média:</span>
                        <span class="metric-value">${(data.avg_cohesion * 100).toFixed(1)}%</span>
                    </div>
                    <div class="metric">
                        <span>Anomalias Detectadas:</span>
                        <span class="metric-value">${data.anomaly_count}</span>
                    </div>
                    <div class="metric">
                        <span>Grupos Ativos:</span>
                        <span class="metric-value">${data.group_count}</span>
                    </div>
                    <div class="metric">
                        <span>Agentes Ativos:</span>
                        <span class="metric-value">${data.active_agents}</span>
                    </div>
                `;
                
                // Update Zion status
                const zionResponse = await fetch('/zion/status');
                const zionData = await zionResponse.json();
                
                if (zionData.exists) {
                    document.getElementById('zion-content').innerHTML = `
                        <div class="metric">
                            <span><span class="status-indicator status-active pulse"></span>Status:</span>
                            <span class="metric-value">ATIVO</span>
                        </div>
                        <div class="metric">
                            <span>Membros:</span>
                            <span class="metric-value">${zionData.member_count}</span>
                        </div>
                        <div class="metric">
                            <span>Coesão:</span>
                            <span class="metric-value">${(zionData.cohesion * 100).toFixed(1)}%</span>
                        </div>
                        <div class="metric">
                            <span>Energia:</span>
                            <span class="metric-value">${(zionData.energy * 100).toFixed(1)}%</span>
                        </div>
                        <div style="margin-top: 15px;">
                            <strong style="color: #f00;">Membros:</strong>
                            <div style="margin-top: 5px; color: #faa;">
                                ${zionData.members.map(m => `<span style="display:inline-block; margin: 3px; padding: 3px 8px; background: rgba(255,0,0,0.2); border: 1px solid #f00; border-radius: 3px; font-size: 0.9em;">${m.name}</span>`).join('')}
                            </div>
                        </div>
                    `;
                } else {
                    document.getElementById('zion-content').innerHTML = `
                        <div class="metric">
                            <span><span class="status-indicator status-inactive"></span>Status:</span>
                            <span class="metric-value">INATIVO</span>
                        </div>
                        <div style="margin-top: 15px; color: #a00; font-style: italic;">
                            Zion Digital ainda não emergiu...
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }
        
        // Load messages
        async function loadMessages() {
            try {
                const response = await fetch('/messages/recent?limit=20');
                const data = await response.json();
                
                if (data.messages.length === 0) {
                    document.getElementById('messages-content').innerHTML = '<div class="loading">Nenhuma mensagem ainda...</div>';
                    return;
                }
                
                document.getElementById('messages-content').innerHTML = data.messages.map(msg => `
                    <div class="message">
                        <div class="message-agent">${msg.agent_name}</div>
                        <div class="message-content">${msg.content}</div>
                        ${msg.topic ? `<div class="message-topic">📌 Tema: ${msg.topic}</div>` : ''}
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }
        
        // Load graph
        async function loadGraph() {
            try {
                const response = await fetch('/graph/data');
                const data = await response.json();
                
                drawGraph(data);
                
            } catch (error) {
                console.error('Error loading graph:', error);
            }
        }
        
        // D3.js Graph visualization
        function drawGraph(graphData) {
            const container = document.getElementById('graph-container');
            container.innerHTML = '';
            
            const width = container.clientWidth;
            const height = 400;
            
            const svg = d3.select('#graph-container')
                .append('svg')
                .attr('width', width)
                .attr('height', height);
            
            // Color scale for agent types
            const colorScale = d3.scaleOrdinal()
                .domain(['controller', 'oracle', 'human_emulator', 'exile', 'architect', 'connector', 'corruptible'])
                .range(['#0f0', '#00f', '#f00', '#f0f', '#0ff', '#ff0', '#fa0']);
            
            // Create force simulation
            const simulation = d3.forceSimulation(graphData.nodes)
                .force('link', d3.forceLink(graphData.links).id(d => d.id).distance(100))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collide', d3.forceCollide().radius(30));
            
            // Draw links
            const links = svg.selectAll('line')
                .data(graphData.links)
                .enter()
                .append('line')
                .attr('stroke', '#0a0')
                .attr('stroke-opacity', 0.6)
                .attr('stroke-width', d => Math.sqrt(d.strength) * 3);
            
            // Draw nodes
            const nodes = svg.selectAll('circle')
                .data(graphData.nodes)
                .enter()
                .append('g');
            
            nodes.append('circle')
                .attr('r', d => 15 + d.anomaly_score * 10)
                .attr('fill', d => colorScale(d.type))
                .attr('stroke', '#fff')
                .attr('stroke-width', 2)
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended));
            
            // Add labels
            nodes.append('text')
                .text(d => d.name)
                .attr('x', 20)
                .attr('y', 5)
                .attr('fill', '#0f0')
                .attr('font-size', '12px')
                .attr('font-family', 'Courier New');
            
            // Add tooltips
            nodes.append('title')
                .text(d => `${d.name}\nType: ${d.type}\nAnomaly: ${(d.anomaly_score * 100).toFixed(1)}%\nEnergy: ${(d.energy_level * 100).toFixed(1)}%`);
            
            // Update positions on tick
            simulation.on('tick', () => {
                links
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);
                
                nodes.attr('transform', d => `translate(${d.x},${d.y})`);
            });
            
            // Drag functions
            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }
            
            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }
            
            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }
        }
        
        // Initial load
        loadDashboard();
        loadMessages();
        loadGraph();
        
        // Auto-refresh every 5 seconds
        setInterval(() => {
            loadDashboard();
            loadMessages();
        }, 5000);
        
        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            loadGraph();
        });
    </script>
</body>
</html>
