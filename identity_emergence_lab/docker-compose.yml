version: '3.8'

services:
  identity-lab:
    build: .
    container_name: tachikoma-lab
    ports:
      - "8000:8000"  # API Backend
      - "8501:8501"  # Frontend Streamlit
    volumes:
      - ./data:/app/data  # Persistir dados
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# Volumes opcionais para persistência adicional
volumes:
  data:
